[workspace]
resolver = "2"
members = ["crates/vivace", "crates/vivace-core", "crates/vivace-autoload"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Adelagric/vivace"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "fs", "process"] }
reqwest = { version = "=0.12.28", features = ["http2", "gzip", "stream"] }
zip = "=2.4.2"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
md-5 = "=0.10.6"
thiserror = "=2.0.20"
clap = { version = "=4.6.6", features = ["derive"] }
pcre2 = "=0.2.11"
walkdir = "=2.5.0"
proptest = "=1.11.0"
base64 = "=0.23.1"
tempfile = "=3.27.0"
