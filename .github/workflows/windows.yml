name: windows

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: build + tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A real php for the .bat proxy execution test — no Composer here:
      # the differential parity suite runs in the `parity` job below. This
      # job covers build, lints, unit tests and the actual .bat execution.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Separate steps: under pwsh only the exit code of the last command in
      # a `run` block counts — a single block would mask a failure.
      - name: fmt (also proves the LF checkout from .gitattributes)
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --workspace --lib

      - name: Bin proxy .bat (bin-compat rule, caller, skip, Composer bytes)
        run: cargo test -p vivacity-core --test fixtures_binproxy bat_

      - name: Bin proxy .bat (real execution via php)
        run: cargo test -p vivacity-core --test fixtures_binproxy bat_proxy_executes -- --ignored

      - name: Smoke (--version)
        run: cargo run --release -p vivacity -- --version

  # The real merge bar: the six-project differential oracle against a pinned
  # native Windows Composer, exactly like ci.yml's parity job — 0 diff
  # required. Everything runs under Git Bash (the harness is bash + tar +
  # diff + jq, all present on windows-latest).
  parity:
    name: parity oracle (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Deep fixture trees (sylius, drupal) can overflow MAX_PATH while
      # composer/git materialize them.
      - name: Allow long git paths
        run: git config --system core.longpaths true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # Pinned to the vendored reference, like ci.yml: the harness
          # compares byte-for-byte, so the Composer version must be
          # deterministic.
          tools: composer:2.10.3
          # ci.yml's list + pdo_sqlite/sqlite3: compiled into php on Linux,
          # separate DLLs in the Windows builds (symfony-demo requires them).
          extensions: mbstring, intl, gd, exif, bcmath, sodium, xml, curl, zip, fileinfo, pdo_sqlite, sqlite3
          ini-values: memory_limit=1G

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Composer downloads and fixtures
        uses: actions/cache@v4
        with:
          # Composer-on-Windows caches under %LOCALAPPDATA%/Composer.
          path: |
            ~/AppData/Local/Composer
            fixtures/work
          key: fixtures-${{ runner.os }}-${{ hashFiles('fixtures/make.sh') }}

      - name: Build
        run: cargo build --release

      - name: Fixtures (create-project sans scripts, qualification à l'oracle)
        run: fixtures/make.sh

      - name: Parity without autoloader (0 diff required)
        run: harness/diff-vendor.sh

      - name: Parity with autoloader, cold then warm classmap cache
        run: |
          harness/diff-vendor.sh --with-autoloader
          harness/diff-vendor.sh --with-autoloader
