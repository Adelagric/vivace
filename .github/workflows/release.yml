name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # x86_64 macOS est cross-compilé depuis le runner arm64 (macos-13 est rare et déprécié)
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p vivace
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vivace dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          tar -C dist -czf vivace-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .
          shasum -a 256 vivace-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > vivace-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vivace-${{ matrix.target }}
          path: vivace-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
