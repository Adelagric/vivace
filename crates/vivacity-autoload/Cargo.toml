[package]
name = "vivacity-autoload"
description = "Byte-identical port of Composer's autoloader generation (classmap, PSR-0/4, files) for vivacity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["composer", "php", "autoload"]
categories = ["development-tools", "command-line-utilities"]

[features]
# Passthrough to vivacity-core's TLS backend selection; see vivacity-core.
default = ["rustls-tls-ring"]
rustls-tls-ring = ["vivacity-core/rustls-tls-ring"]
rustls-tls-no-provider = ["vivacity-core/rustls-tls-no-provider"]

[dependencies]
vivacity-core = { path = "../vivacity-core", version = "0.8.0", default-features = false }
serde_json.workspace = true
thiserror.workspace = true
md-5.workspace = true
pcre2.workspace = true
walkdir.workspace = true
base64.workspace = true
sha1.workspace = true

[dev-dependencies]
tempfile.workspace = true
