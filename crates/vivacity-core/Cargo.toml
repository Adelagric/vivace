tokio.workspace = true
reqwest.workspace = true
zip.workspace = true
sha1.workspace = true
tempfile.workspace = true
md-5.workspace = true
thiserror.workspace = true
rayon.workspace = true
hex = "=0.4.3"

[dev-dependencies]
proptest.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "=1.0.0-alpha.4"
