[package]
name = "vivace"
description = "Fast, Composer-compatible installer for PHP projects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vivace-core = { path = "../vivace-core" }
vivace-resolver = { path = "../vivace-resolver" }
vivace-autoload = { path = "../vivace-autoload" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/vivace-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "vivace"
